<?xml version="1.0" standalone="yes"?>
<DataSetConfiguration xmlns="http://tempuri.org/DataSetConfiguration.xsd">
  <xs:schema id="DataSetConfiguration" targetNamespace="http://tempuri.org/DataSetConfiguration.xsd" xmlns:mstns="http://tempuri.org/DataSetConfiguration.xsd" xmlns="http://tempuri.org/DataSetConfiguration.xsd" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:msdata="urn:schemas-microsoft-com:xml-msdata" xmlns:msprop="urn:schemas-microsoft-com:xml-msprop" attributeFormDefault="qualified" elementFormDefault="qualified">
    <xs:element name="DataSetConfiguration" msdata:IsDataSet="true" msdata:Locale="de-CH" msprop:Activated="True" msprop:OMrunVersion="5.1.0.2">
      <xs:complexType>
        <xs:choice minOccurs="0" maxOccurs="unbounded">
          <xs:element name="TestScenarioPublisher">
            <xs:complexType>
              <xs:sequence>
                <xs:element name="Environment" type="xs:string" default="*" minOccurs="0" />
                <xs:element name="TestScenario" type="xs:string" default="*" minOccurs="0" />
                <xs:element name="PublisherFlag" type="xs:boolean" default="false" minOccurs="0" />
                <xs:element name="Remark" type="xs:string" minOccurs="0" />
              </xs:sequence>
            </xs:complexType>
          </xs:element>
          <xs:element name="PathConfiguration">
            <xs:complexType>
              <xs:sequence>
                <xs:element name="PathType" type="xs:string" minOccurs="0" />
                <xs:element name="PathName" type="xs:string" minOccurs="0" />
                <xs:element name="Remark" type="xs:string" default="&quot;&quot;" minOccurs="0" />
              </xs:sequence>
            </xs:complexType>
          </xs:element>
          <xs:element name="DashboardMapping">
            <xs:complexType>
              <xs:sequence>
                <xs:element name="Level1" default="Scenario" minOccurs="0">
                  <xs:simpleType>
                    <xs:restriction base="xs:string">
                      <xs:maxLength value="50" />
                    </xs:restriction>
                  </xs:simpleType>
                </xs:element>
                <xs:element name="Level2" default="Component" minOccurs="0">
                  <xs:simpleType>
                    <xs:restriction base="xs:string">
                      <xs:maxLength value="50" />
                    </xs:restriction>
                  </xs:simpleType>
                </xs:element>
                <xs:element name="Level3" default="Object" minOccurs="0">
                  <xs:simpleType>
                    <xs:restriction base="xs:string">
                      <xs:maxLength value="50" />
                    </xs:restriction>
                  </xs:simpleType>
                </xs:element>
              </xs:sequence>
            </xs:complexType>
          </xs:element>
        </xs:choice>
      </xs:complexType>
    </xs:element>
  </xs:schema>
  <TestScenarioPublisher>
	  <Environment>TestEnvironment1</Environment>
	  <TestScenario>TestScenario1</TestScenario>
	  <PublisherFlag>true</PublisherFlag>
  </TestScenarioPublisher>
  <TestScenarioPublisher>
	  <Environment>TestEnvironment2</Environment>
	  <TestScenario>TestScenario1</TestScenario>
	  <PublisherFlag>true</PublisherFlag>
  </TestScenarioPublisher>
  <PathConfiguration>
	  <PathType>DashboardPublisherPath</PathType>
	  <PathName>C:\inetpub\wwwroot\OMdashboard\App_Data</PathName>
	  <Remark>Default path</Remark>
  </PathConfiguration>
  <PathConfiguration>
	  <PathType>DashboardPublisherLink</PathType>
	  <PathName>http://localhost/OMdashboard/</PathName>
	  <Remark>Default link</Remark>
  </PathConfiguration>
  <DashboardMapping>
	  <Level1>Scenario</Level1>
	  <Level2>Component</Level2>
	  <Level3>Object</Level3>
  </DashboardMapping>
</DataSetConfiguration>