[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omrun-param-tool"
version = "0.1.0"
description = "Hydrate/dehydrate OMrun SQL placeholders directly from OMrun XML configs (local, airgapped)."
requires-python = ">=3.10"
# Kern laeuft ohne externe Abhaengigkeit (Python-Standardbibliothek).
dependencies = []

[project.optional-dependencies]
lxml = ["lxml>=4.9"]          # optionaler Beschleuniger / hoehere Serialisierungstreue
clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=7.0"]

[project.scripts]
omrun-param-tool = "omrun_paramtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
